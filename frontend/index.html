  <meta property="og:type" content="website" />

  <!-- Canonical is set per-route by the <SEO> component (react-helmet-async).
       Do NOT hardcode one here: every route serves this same index.html, so a
       static canonical makes every sub-page (e.g. /quick-score) declare the
       homepage as its canonical → Google drops them as duplicates. -->

  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=clash-display@200,300,400,500,600,700&display=swap" rel="stylesheet" />
